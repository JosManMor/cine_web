# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  Simulación de producción
#
# El código fuente, vendor PHP y el build del frontend están DENTRO de la
# imagen (Dockerfile.prod). No hay bind mounts de código fuente.
#
# ── Primer despliegue ──────────────────────────────────────────────────────
#   cp .env.prod.example .env.prod   # editar contraseñas
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ── Actualizar código / frontend ──────────────────────────────────────────
#   docker compose -f docker-compose.prod.yml down
#   docker volume rm $(docker compose -f docker-compose.prod.yml \
#       config --volumes | grep app_www)    # elimina el volumen de app
#   docker compose -f docker-compose.prod.yml up -d --build
#   (mysql_prod_data NO se elimina — los datos de la BD persisten)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PHP-FPM ────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: cine-sendera:prod
    container_name: cine_app
    restart: unless-stopped
    # app_www se auto-puebla desde la imagen en el primer arranque.
    # app_www sirve también a nginx y a los workers para compartir storage.
    volumes:
      - app_www:/var/www
    env_file: .env.prod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net
      - db_net
    healthcheck:
      # Saludable cuando el cache de config existe (setup del entrypoint terminó)
      test: ["CMD-SHELL", "[ -f /var/www/bootstrap/cache/config.php ]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cine_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app_www:/var/www:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - public_net
      - app_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── MySQL ──────────────────────────────────────────────────────────────────
  # Sin `ports`: solo accesible dentro de db_net, nunca desde el host.
  mysql:
    image: mysql:8.0
    container_name: cine_mysql
    restart: unless-stopped
    # MySQL lee MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
    # directamente de .env.prod — sin interpolación del shell del host.
    env_file: .env.prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1' 2>/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

  # ── Mailpit (captura de emails en simulación) ──────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: cine_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"

  # ── Queue worker ───────────────────────────────────────────────────────────
  queue:
    image: cine-sendera:prod # Reutiliza la imagen ya construida
    container_name: cine_queue
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=3",
        "--timeout=90",
        "--sleep=3",
        "--max-time=3600",
      ]
    volumes:
      - app_www:/var/www
    env_file: .env.prod
    depends_on:
      app:
        condition: service_healthy # Espera a que el setup de app termine
      mysql:
        condition: service_healthy
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # ── Cron (backup diario a las 02:00) ──────────────────────────────────────
  # watchdog.sh no aplica aquí: restart:always ya cubre los reinicios de contenedores.
  cron:
    image: cine-sendera:prod
    container_name: cine_cron
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cron-entrypoint.sh"]
    env_file: .env.prod
    volumes:
      - cine_backups:/var/backups/cine
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── Scheduler (cron de Artisan) ────────────────────────────────────────────
  scheduler:
    image: cine-sendera:prod
    container_name: cine_scheduler
    restart: unless-stopped
    command:
      [
        "/bin/sh",
        "-c",
        "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done",
      ]
    volumes:
      - app_www:/var/www
    env_file: .env.prod
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

# ── Volúmenes ────────────────────────────────────────────────────────────────
volumes:
  app_www:
    # Se auto-puebla desde la imagen cine-sendera:prod en el primer arranque.
    # Para actualizar código: eliminar este volumen y volver a levantar.
  mysql_prod_data:
    # Datos de MySQL — persiste entre despliegues, NO eliminar en actualizaciones.
  cine_backups:
    # Backups diarios generados por backup.sh — persiste entre reinicios del cron.

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  public_net:
  app_net:
    internal: true
  db_net:
    internal: true
