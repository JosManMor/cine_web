name: E2E Image Cache

# Los PR solo pueden leer la caché de Actions de su rama base. Este workflow
# construye Dockerfile.prod en cada push a dev para que el job "Prod E2E" de
# ci.yml reutilice las capas (apt, composer, npm) desde el primer push del PR.
on:
  push:
    branches: [dev]
    paths:
      - docker/php/Dockerfile.prod
      - docker/php/entrypoint.prod.sh
      - backend/**
      - frontend/**
      - .github/workflows/e2e-image-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-image-cache
  cancel-in-progress: true

jobs:
  build-cache:
    name: Build prod image cache
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build prod image (cache only)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: false
          build-args: |
            VITE_DEMO_MODE=true
          cache-from: type=gha,scope=e2e-prod
          cache-to: type=gha,scope=e2e-prod,mode=max
