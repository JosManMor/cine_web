name: Preproducción

on:
  push:
    branches: [pre]

concurrency:
  group: preprod-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    name: Versionado (semantic-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Dos releases simultáneas calcularían la misma versión; se ejecutan en serie.
    concurrency:
      group: release-pre
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # semantic-release necesita todo el historial y los tags anteriores.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Calcula la versión a partir de los commits (Conventional Commits) desde
      # el último tag, crea el tag vX.Y.Z y el GitHub Release. Si solo hay
      # commits que no versionan (docs, chore, ci...), no crea nada.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Instalación explícita con versiones fijas y sin scripts de ciclo de
        # vida (en vez de `npx`, que instala bajo demanda y los ejecuta).
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/semantic-release" \
            semantic-release@25.0.9 \
            conventional-changelog-conventionalcommits@9.3.1
          "$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"

      - name: Read released version
        id: version
        run: echo "version=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

  push-prod:
    name: Build & push prod image
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          build-args: |
            VITE_DEMO_MODE=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cine-sendera:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/cine-sendera:${{ github.sha }}
            ${{ needs.release.outputs.version && format('{0}/cine-sendera:{1}', secrets.DOCKERHUB_USERNAME, needs.release.outputs.version) || '' }}

  deploy:
    name: Deploy to personal server
    needs: push-prod
    # Runner instalado en el servidor personal con la etiqueta `cine-deploy`.
    runs-on: [self-hosted, linux, cine-deploy]
    environment:
      name: preprod
    # Un solo despliegue a la vez; uno nuevo espera a que termine el anterior.
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        env:
          CINE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cine-sendera:${{ github.sha }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/cine-sendera' }}
        run: scripts/deploy.sh

      - name: Log out of Docker Hub
        if: always()
        run: docker logout
