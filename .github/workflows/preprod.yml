name: Preproducción

on:
  push:
    branches: [pre]

concurrency:
  group: preprod-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Tests backend (PHP) ─────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate --env=testing

      - name: Run tests
        run: php artisan test

  # ── Job 2: Tests frontend (Vitest + build) ─────────────────────────────────
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642195f882787471af267e5 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Run tests
        run: npm test

  # ── Job 3: Build production Docker stack ───────────────────────────────────
  build-prod:
    name: Build prod stack
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare .env.prod
        env:
          CI_APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cp .env.prod.example .env.prod
          sed -i "s|^APP_KEY=.*|APP_KEY=${CI_APP_KEY}|" .env.prod
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ci_root_password|" .env.prod

      - name: Build and start Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180

  # ── Job 4: E2E tests (Playwright) ─────────────────────────────────────────
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build-prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare .env.prod
        env:
          CI_APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cp .env.prod.example .env.prod
          sed -i "s|^APP_KEY=.*|APP_KEY=${CI_APP_KEY}|" .env.prod
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ci_root_password|" .env.prod

      - name: Build and start Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642195f882787471af267e5 # v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install --save-dev @playwright/test@1.52.0 --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests
        run: ./node_modules/.bin/playwright test
        env:
          BASE_URL: http://localhost

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # ── Job 5: OWASP ZAP security scan ────────────────────────────────────────
  security-owasp:
    name: OWASP ZAP scan
    runs-on: ubuntu-latest
    needs: [build-prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare .env.prod
        env:
          CI_APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cp .env.prod.example .env.prod
          sed -i "s|^APP_KEY=.*|APP_KEY=${CI_APP_KEY}|" .env.prod
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=ci_test_password|" .env.prod
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ci_root_password|" .env.prod

      - name: Build and start Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180

      - name: ZAP Baseline Scan (frontend)
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: http://localhost
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          fail_action: warn
          allow_issue_writing: false

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@a9a916402665623ce9d37a6998d7b48e6b35dd6c # v0.9.0
        with:
          target: http://localhost/api
          rules_file_name: .zap/rules.tsv
          cmd_options: '-f openapi'
          fail_action: warn
          allow_issue_writing: false

      - name: Fail on HIGH or CRITICAL findings
        if: always()
        run: |
          # Check ZAP reports for HIGH/CRITICAL alerts
          for report in zap_baseline_report.html zap_api_report.html; do
            if [ -f "$report" ] && grep -qiE '(High|Critical)\s*\(' "$report" 2>/dev/null; then
              echo "::error::$report contains HIGH or CRITICAL findings"
              FOUND_CRITICAL=true
            fi
          done
          if [ "${FOUND_CRITICAL:-false}" = "true" ]; then
            exit 1
          fi
          echo "No HIGH or CRITICAL findings."

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-reports
          path: |
            zap_baseline_report.html
            zap_api_report.html
          retention-days: 30

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
