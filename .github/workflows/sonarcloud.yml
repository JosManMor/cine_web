name: SonarCloud

# Análisis de SonarQube Cloud solo en las PR hacia dev. Las PR a pre/main y los
# merges (push) a dev/pre no se analizan. Requiere desactivar el análisis
# automático en SonarCloud (Administration → Analysis Method) y el secreto SONAR_TOKEN.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    # Las PR desde forks no reciben secretos, así que SONAR_TOKEN estaría vacío.
    # Se omite el job: un check omitido cuenta como superado en la protección de ramas.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historial completo para el blame y la detección de código nuevo

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      # Sin este informe Sonar ve 0 % de cobertura en el código nuevo.
      - name: Generate frontend coverage
        run: npm run test:coverage
        working-directory: frontend

      # Sonar resuelve las rutas del lcov desde la raíz del repo, no desde frontend/.
      - name: Prefix lcov paths
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=josmanmor
            -Dsonar.projectKey=JosManMor_cine_web
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/__tests__/**,**/*.test.*,backend/**
