name: CI

on:
  pull_request:
    branches: [dev, pre, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Backend tests (PHPUnit with in-memory SQLite) ──────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate --env=testing

      - name: Run tests
        run: php artisan test

  # ── Job 2: Frontend unit tests + build check ──────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (verify no errors)
        run: npm run build

      - name: Run Vitest unit tests
        run: npm run test

  # ── Job 3: Docker integration — build and verify containers ───────────────
  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:dGVzdGluZ2tleWZvcmNpZW52MTIzNA==/' .env
          sed -i 's/^HOST_UID=.*/HOST_UID=1001/' .env
          sed -i 's/^HOST_GID=.*/HOST_GID=1001/' .env

      - name: Install Composer dependencies
        run: docker compose run --rm --no-deps --entrypoint sh app -c "composer install --no-interaction --prefer-dist"
        timeout-minutes: 5

      - name: Build and start containers
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for healthy containers
        run: bash scripts/wait-healthy.sh 180

      - name: Show container states
        if: always()
        run: docker compose ps

      - name: Verify network isolation (frontend cannot resolve mysql)
        run: |
          if docker exec cine_frontend nslookup mysql 2>/dev/null; then
            echo "FAIL: frontend container can resolve mysql"
            exit 1
          fi
          echo "PASS: frontend container cannot resolve mysql"

      - name: Verify network isolation (frontend cannot resolve redis)
        run: |
          if docker exec cine_frontend nslookup redis 2>/dev/null; then
            echo "FAIL: frontend container can resolve redis"
            exit 1
          fi
          echo "PASS: frontend container cannot resolve redis"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  # ── Job 4: E2E tests with Playwright ──────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:dGVzdGluZ2tleWZvcmNpZW52MTIzNA==/' .env
          sed -i 's/^HOST_UID=.*/HOST_UID=1001/' .env
          sed -i 's/^HOST_GID=.*/HOST_GID=1001/' .env

      - name: Install Composer dependencies
        run: docker compose run --rm --no-deps --entrypoint sh app -c "composer install --no-interaction --prefer-dist"
        timeout-minutes: 5

      - name: Build and start containers
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for healthy containers
        run: bash scripts/wait-healthy.sh 180

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Docker-created node_modules
        run: sudo rm -rf frontend/node_modules

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: http://localhost

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200
