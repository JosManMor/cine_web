services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: cine_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./backend:/var/www

    depends_on:
      - mysql

    networks:
      - cine_network

  apache:
    image: httpd:2.4

    container_name: cine_apache

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./backend:/var/www
      - ./docker/apache/000-default.conf:/usr/local/apache2/conf/httpd.conf

    depends_on:
      - app

    networks:
      - cine_network

  mysql:
    image: mysql:8.0

    container_name: cine_mysql

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: cine_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cine_user
      MYSQL_PASSWORD: cine_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cine_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: cine_phpmyadmin

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

    networks:
      - cine_network

volumes:
  mysql_data:

networks:
  cine_network: