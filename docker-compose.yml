services:

  redis:
    image: redis:7-alpine
    container_name: cine_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cine_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}

    container_name: cine_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./backend:/var/www
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "-r", "$$fp = @fsockopen('127.0.0.1', 9000); exit($$fp ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - cine_network

  apache:
    image: httpd:2.4

    container_name: cine_apache

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./backend:/var/www
      - ./docker/apache/000-default.conf:/usr/local/apache2/conf/httpd.conf

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /up HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && read -r line <&3 && [[ \"$$line\" =~ 200 ]]'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - cine_network

  mysql:
    image: mysql:8.0

    container_name: cine_mysql

    restart: unless-stopped

    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cine_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3

    container_name: cine_phpmyadmin

    restart: unless-stopped

    ports:
      - "${FORWARD_PMA_PORT:-8080}:80"

    environment:
      PMA_HOST: ${DB_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - cine_network

  mailpit:
    image: axllent/mailpit:v1.31.4

    container_name: cine_mailpit

    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - cine_network
  frontend:
    image: node:20-alpine

    container_name: cine_frontend

    working_dir: /app

    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    environment:
      VITE_PROXY_TARGET: http://apache

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - apache

    networks:
      - cine_network
      
volumes:
  mysql_data:
  redis_data:

networks:
  cine_network:
