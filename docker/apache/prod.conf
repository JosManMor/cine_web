ServerRoot "/usr/local/apache2"

# Oculta versión y firma del servidor
ServerTokens Prod
ServerSignature Off

Listen 80

LoadModule mpm_event_module     modules/mod_mpm_event.so
LoadModule authz_core_module    modules/mod_authz_core.so
LoadModule dir_module           modules/mod_dir.so
LoadModule log_config_module    modules/mod_log_config.so
LoadModule rewrite_module       modules/mod_rewrite.so
LoadModule proxy_module         modules/mod_proxy.so
LoadModule proxy_fcgi_module    modules/mod_proxy_fcgi.so
LoadModule unixd_module         modules/mod_unixd.so
LoadModule headers_module       modules/mod_headers.so
LoadModule deflate_module       modules/mod_deflate.so
LoadModule expires_module       modules/mod_expires.so
LoadModule filter_module        modules/mod_filter.so
LoadModule setenvif_module      modules/mod_setenvif.so

User daemon
Group daemon

ServerAdmin admin@localhost
ServerName localhost

DocumentRoot "/var/www/public"

# ── Seguridad: cabeceras HTTP ─────────────────────────────────────────────────
Header always set X-Content-Type-Options   "nosniff"
Header always set X-Frame-Options          "SAMEORIGIN"
Header always set X-XSS-Protection         "1; mode=block"
Header always set Referrer-Policy          "strict-origin-when-cross-origin"
Header always set Permissions-Policy       "camera=(), microphone=(), geolocation=()"
Header always unset X-Powered-By

# ── Compresión gzip ───────────────────────────────────────────────────────────
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
AddOutputFilterByType DEFLATE application/javascript application/json application/xml

# ── Cache de activos estáticos ────────────────────────────────────────────────
ExpiresActive On
ExpiresByType text/css             "access plus 1 year"
ExpiresByType application/javascript "access plus 1 year"
ExpiresByType image/png            "access plus 1 month"
ExpiresByType image/jpeg           "access plus 1 month"
ExpiresByType image/svg+xml        "access plus 1 month"
ExpiresByType font/woff2           "access plus 1 year"

<Directory "/var/www/public">
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php
</Directory>

# Bloquea acceso a archivos sensibles
<FilesMatch "(\.env|composer\.json|composer\.lock|package\.json|phpunit\.xml)$">
    Require all denied
</FilesMatch>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://app:9000"
</FilesMatch>

# ── Logs (stdout/stderr → Docker) ─────────────────────────────────────────────
ErrorLog  /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined
