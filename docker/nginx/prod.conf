# ── IP real del cliente detrás de Cloudflare ──────────────────────────────
# El tráfico llega a través del proxy de Cloudflare: sin esto $remote_addr
# sería la IP de Cloudflare. Solo se acepta la cabecera CF-Connecting-IP
# cuando la conexión viene de sus rangos (https://www.cloudflare.com/ips/,
# actualizados 2026-11-09); desde cualquier otra IP se ignora y no se puede
# falsificar. Laravel recibe también esta IP (REMOTE_ADDR vía fastcgi_params).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Registro de accesos ────────────────────────────────────────────────────
# Un archivo por día con la IP de cada cliente. Se guarda en el volumen
# nginx_logs (ver docker-compose.prod.yml), que sobrevive a los despliegues.
map $time_iso8601 $log_date {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
    default                         sin-fecha;
}

# País según Cloudflare (CF-IPCountry). Solo es fiable si la petición pasó por
# Cloudflare; un acceso directo al servidor puede enviar cualquier valor.
log_format accesos '$remote_addr $http_cf_ipcountry [$time_iso8601] "$request" $status '
                   '$body_bytes_sent $request_time "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/accesos/access-$log_date.log accesos;
    # También a stdout, para `docker logs cine_nginx`
    access_log /dev/stdout accesos;

    root /var/www/public;
    # Vite compila con base="/build/" → index.html queda en public/build/
    index build/index.html;

    # Health check endpoint (independiente de PHP-FPM)
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback para react-router-dom
    location / {
        try_files $uri $uri/ /build/index.html;
    }

    # API Laravel → FastCGI a PHP-FPM
    # El patrón (/|$) cubre tanto /api como /api/ruta sin requerir barra final.
    location ~ ^/(api|up|sanctum)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
    }

    # Mailpit UI — proxy inverso con soporte WebSocket (actualizaciones en tiempo real)
    location /mailpit/ {
        proxy_pass http://mailpit:8025/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
