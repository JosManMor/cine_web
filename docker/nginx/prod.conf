# ── IP real del cliente (Cloudflare Tunnel) ───────────────────────────────
# cloudflared corre en el host y conecta a 127.0.0.1:80; Docker entrega esas
# conexiones desde la puerta de enlace de la red bridge (172.16.0.0/12, o
# 192.168.0.0/16 si Docker agotó ese rango). La IP del usuario viene en
# CF-Connecting-IP. Es seguro fiarse de esos rangos porque el puerto solo se
# publica en 127.0.0.1 (docker-compose.prod.yml): nadie de fuera puede
# conectar y falsificar la cabecera. Laravel recibe también esta IP
# (REMOTE_ADDR vía fastcgi_params).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# ── Registro de accesos ────────────────────────────────────────────────────
# Un archivo por día con la IP de cada cliente. Se guarda en el volumen
# nginx_logs (ver docker-compose.prod.yml), que sobrevive a los despliegues.
map $time_iso8601 $log_date {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
    default                         sin-fecha;
}

# País según Cloudflare (CF-IPCountry).
log_format accesos '$remote_addr $http_cf_ipcountry [$time_iso8601] "$request" $status '
                   '$body_bytes_sent $request_time "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/accesos/access-$log_date.log accesos;
    # También a stdout, para `docker logs cine_nginx`
    access_log /dev/stdout accesos;

    root /var/www/public;
    # Vite compila con base="/build/" → index.html queda en public/build/
    index build/index.html;

    # Health check endpoint (independiente de PHP-FPM)
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback para react-router-dom
    location / {
        try_files $uri $uri/ /build/index.html;
    }

    # API Laravel → FastCGI a PHP-FPM
    # El patrón (/|$) cubre tanto /api como /api/ruta sin requerir barra final.
    location ~ ^/(api|up|sanctum)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
    }

    # Mailpit UI — proxy inverso con soporte WebSocket (actualizaciones en tiempo real)
    location /mailpit/ {
        proxy_pass http://mailpit:8025/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
