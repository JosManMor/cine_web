# Generar clave: php artisan key:generate --show (debe iniciar con base64:)
# Crear secret real: kubectl -n cine-web create secret generic cine-secrets --from-env-file=<archivo>
# Si la imagen es privada: kubectl -n cine-web create secret docker-registry dockerhub-regcred --docker-server=https://index.docker.io/v1/ --docker-username=<user> --docker-password=<token> --docker-email=<email>
# No aplicar en CI/CD para evitar sobrescribir los valores reales con placeholders
apiVersion: v1
kind: Secret
metadata:
  name: cine-secrets
  namespace: cine-web
  labels:
    app.kubernetes.io/name: cine-secrets
    app.kubernetes.io/part-of: cine-sendera
type: Opaque
stringData:
  APP_KEY: "base64:REEMPLAZAR"
  DB_PASSWORD: "REEMPLAZAR"
  MYSQL_PASSWORD: "REEMPLAZAR"
  MYSQL_ROOT_PASSWORD: "REEMPLAZAR"
  ADMIN_PASSWORD: "REEMPLAZAR"
