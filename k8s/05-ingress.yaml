# Para asignar un dominio, descomentar la linea host (ej. host: cine.example.com)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cine-ingress
  namespace: cine-web
  labels:
    app.kubernetes.io/name: cine-ingress
    app.kubernetes.io/part-of: cine-sendera
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
