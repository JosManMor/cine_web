apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: cine-web
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: cine-sendera
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: cine-sendera
    spec:
      automountServiceAccountToken: false
      # Lo crea el workflow k3s-deploy con DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
      imagePullSecrets:
        - name: dockerhub-regcred
      terminationGracePeriodSeconds: 100
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z app 80; do echo "esperando app..."; sleep 3; done
      containers:
        - name: queue
          image: USUARIO/cine-sendera:TAG
          args:
            - php
            - artisan
            - queue:work
            - --tries=3
            - --timeout=90
            - --sleep=3
            - --max-time=3600
          envFrom:
            - configMapRef:
                name: cine-config
            - secretRef:
                name: cine-app-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              cpu: 500m
              ephemeral-storage: 256Mi
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage