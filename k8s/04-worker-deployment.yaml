# Deployment queue. Referencia: servicio queue de docker-compose.prod.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: cine-web
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: cine-sendera
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: cine-sendera
    spec:
      # Mayor que --timeout=90 para no cortar jobs en curso.
      terminationGracePeriodSeconds: 100
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        # El Service app solo tiene endpoint cuando migraciones y cache terminaron.
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z app 80; do echo "esperando app..."; sleep 3; done
      containers:
        - name: queue
          image: USUARIO/cine-sendera:TAG
          # args (no command) conserva el ENTRYPOINT de la imagen.
          args:
            - php
            - artisan
            - queue:work
            - --tries=3
            - --timeout=90
            - --sleep=3
            - --max-time=3600
          envFrom:
            - configMapRef:
                name: cine-config
            - secretRef:
                name: cine-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage