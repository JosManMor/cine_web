apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: cine-web
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: cine-sendera
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: cine-sendera
    spec:
      automountServiceAccountToken: false
      # Lo crea el workflow k3s-deploy con DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
      imagePullSecrets:
        - name: dockerhub-regcred
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z app 80; do echo "esperando app..."; sleep 3; done
      containers:
        - name: scheduler
          image: USUARIO/cine-sendera:TAG
          args:
            - php
            - artisan
            - schedule:work
          envFrom:
            - configMapRef:
                name: cine-config
            - secretRef:
                name: cine-app-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
              ephemeral-storage: 64Mi
            limits:
              memory: 128Mi
              cpu: 250m
              ephemeral-storage: 256Mi
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage