# Deployment scheduler. Referencia: servicio scheduler de docker-compose.prod.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: cine-web
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: cine-sendera
spec:
  # Una segunda replica ejecutaria demo:reset dos veces.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: cine-sendera
    spec:
      # Equivale a user: www-data de Compose (UID/GID 33 en la imagen Debian).
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z app 80; do echo "esperando app..."; sleep 3; done
      containers:
        - name: scheduler
          image: USUARIO/cine-sendera:TAG
          # args (no command) conserva el ENTRYPOINT de la imagen.
          args:
            - php
            - artisan
            - schedule:work
          envFrom:
            - configMapRef:
                name: cine-config
            - secretRef:
                name: cine-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage