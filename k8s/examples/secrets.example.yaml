# Plantilla de los Secrets de preproducción. Está fuera de k8s/ para que
# `kubectl apply -f k8s/` y el workflow k3s-deploy nunca la apliquen.
#
# No aplicar este archivo con los placeholders: crear los secrets reales a mano.
#   kubectl -n cine-web create secret generic cine-app-secrets \
#     --from-literal=APP_KEY="$(php artisan key:generate --show)" \
#     --from-literal=DB_PASSWORD=<pass> --from-literal=ADMIN_PASSWORD=<pass>
#   kubectl -n cine-web create secret generic cine-mysql-secrets \
#     --from-literal=MYSQL_ROOT_PASSWORD=<pass>
#
# dockerhub-regcred lo crea el workflow con DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
#
# Se separan para que la app no reciba la contraseña root de MySQL ni MySQL
# la APP_KEY. MySQL toma MYSQL_PASSWORD de cine-app-secrets/DB_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: cine-app-secrets
  namespace: cine-web
  labels:
    app.kubernetes.io/name: cine-app-secrets
    app.kubernetes.io/part-of: cine-sendera
type: Opaque
stringData:
  APP_KEY: "base64:REEMPLAZAR"
  DB_PASSWORD: "REEMPLAZAR"
  ADMIN_PASSWORD: "REEMPLAZAR"
---
apiVersion: v1
kind: Secret
metadata:
  name: cine-mysql-secrets
  namespace: cine-web
  labels:
    app.kubernetes.io/name: cine-mysql-secrets
    app.kubernetes.io/part-of: cine-sendera
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "REEMPLAZAR"
