apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: cine-web
spec:
  replicas: 1
  serviceName: mysql
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          # Solo las variables que necesita MySQL: no recibe APP_KEY ni ADMIN_PASSWORD.
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cine-config
                  key: DB_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: cine-config
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cine-app-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cine-mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysql -h localhost -u"$MYSQL_USER" "$MYSQL_DATABASE" -e 'SELECT 1'
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysql -h localhost -u"$MYSQL_USER" "$MYSQL_DATABASE" -e 'SELECT 1'
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness solo comprueba que mysqld responde: una consulta autenticada
          # lenta bajo carga provocaría reinicios innecesarios de la base de datos.
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
