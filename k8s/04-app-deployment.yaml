apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: cine-web
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: cine-sendera
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: cine-sendera
    spec:
      automountServiceAccountToken: false
      # Lo crea el workflow k3s-deploy con DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
      imagePullSecrets:
        - name: dockerhub-regcred
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo "esperando mysql..."; sleep 2; done
        - name: init-storage
          image: USUARIO/cine-sendera:TAG
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /var/www/storage/logs \
                       /var/www/storage/framework/cache \
                       /var/www/storage/framework/sessions \
                       /var/www/storage/framework/views
              chown -R 33:33 /var/www/storage
              chmod -R 775 /var/www/storage
              cp -a /var/www/public/. /public/
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
            - name: public
              mountPath: /public
      containers:
        - name: app
          image: USUARIO/cine-sendera:TAG
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: cine-config
            - secretRef:
                name: cine-app-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /var/www/storage
          # Listo cuando el entrypoint termino (existe el cache de config).
          startupProbe:
            exec:
              command: ["sh", "-c", "[ -f /var/www/bootstrap/cache/config.php ]"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18 # 60s de margen + 12 intentos, como Compose
          readinessProbe:
            exec:
              command: ["sh", "-c", "[ -f /var/www/bootstrap/cache/config.php ]"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi
              cpu: 750m
              ephemeral-storage: 1Gi
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: public
              mountPath: /var/www/public
              readOnly: true
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
              ephemeral-storage: 64Mi
            limits:
              memory: 128Mi
              cpu: 250m
              ephemeral-storage: 256Mi
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage
        - name: public
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: cine-web
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: cine-sendera
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 80
      targetPort: 80