apiVersion: v1
kind: ConfigMap
metadata:
  name: cine-config
  namespace: cine-web
  labels:
    app.kubernetes.io/name: cine-config
    app.kubernetes.io/part-of: cine-sendera
data:
  APP_NAME: "CineSystem"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost"
  FRONTEND_URL: "http://localhost"
  CORS_ALLOWED_ORIGINS: ""
  APP_LOCALE: "es"
  APP_FALLBACK_LOCALE: "es"
  APP_FAKER_LOCALE: "es_MX"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  ADMIN_NAME: "Administrador"
  ADMIN_EMAIL: "admin@cinesendera.com"
  DEMO_MODE: "true"
  DEMO_TIMEZONE: "America/Mexico_City"
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: "error"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "cine_db"
  DB_USERNAME: "cine_user"
  MYSQL_DATABASE: "cine_db"
  MYSQL_USER: "cine_user"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  MAIL_MAILER: "smtp"
  MAIL_SCHEME: "null"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_USERNAME: "null"
  MAIL_PASSWORD: "null"
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: "noreply@cinesendera.com"
  MAIL_FROM_NAME: "CineSendera"
  L5_SWAGGER_GENERATE_ALWAYS: "false"
